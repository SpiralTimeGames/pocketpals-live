<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Pals">
  <meta name="theme-color" content="#2EC4FF">
  <title>Pocket Pals</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #1F1440;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Phone-shaped play area: fills a phone screen, and sits centred as a tall panel on a wide screen. */
    #frame {
      position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100vw, calc(100vh * 0.5625)); width: min(100vw, calc(100dvh * 0.5625));
      height: 100vh; height: 100dvh;
      background: linear-gradient(#2EC4FF, #FFE45C);
    }
    @media (max-aspect-ratio: 3/4) { #frame { width: 100vw; } }   /* any portrait screen: use the full width */
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(#2EC4FF, #FFE45C); transition: opacity .4s;
    }
    #loading h1 {
      margin: 0; font-size: clamp(40px, 13vw, 64px); color: #FF3D7F; font-weight: 900;
      -webkit-text-stroke: 3px #fff; paint-order: stroke fill; letter-spacing: .5px;
      text-shadow: 0 6px 0 rgba(155, 61, 255, .45);
    }
    #capsule { width: 84px; height: 84px; border-radius: 50%; position: relative; overflow: hidden;
      background: linear-gradient(#FF3D7F 0 49%, #fff 49% 51%, #F7F3FB 51%);
      box-shadow: 0 10px 0 rgba(31, 20, 64, .12); animation: bob 1.4s ease-in-out infinite; }
    #capsule::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255, 255, 255, .6); left: 18px; top: 16px; }
    @keyframes bob { 50% { transform: translateY(-10px) rotate(-6deg); } }
    #bar { width: 62%; max-width: 280px; height: 18px; border-radius: 9px; background: rgba(31, 20, 64, .15); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #FF3D7F; border-radius: 9px; transition: width .2s; }
    #msg { color: #1F1440; font-weight: 700; font-size: 15px; text-align: center; padding: 0 24px; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Pocket Pals</h1>
      <div id="capsule"></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">Loading…</div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/Web.data.unityweb",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
      codeUrl: buildUrl + "/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "PocketZoo",
      productVersion: "0.1.0",
      // Sharp on phones without rendering at 3x (keeps it smooth on older phones).
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill"), msg = document.querySelector("#msg"), loading = document.querySelector("#loading");
    // Long-press and pinch must not open menus or zoom the page.
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
        msg.textContent = p < 0.9 ? "Loading… " + Math.round(p * 100) + "%" : "Almost there…";
      }).then(function () {
        loading.style.opacity = 0;
        setTimeout(function () { loading.remove(); }, 450);
      }).catch(function (err) {
        msg.textContent = "Sorry, Pocket Pals couldn't start on this browser. " + err;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
